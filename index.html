<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>韓国犬同伴マップ / Korea Dog-Friendly Map</title>
<meta name="description" content="韓国で犬と一緒に店内に入れるカフェ・レストラン2,597軒。政府登録店の全件を、日本語・英語・ハングルで地図から探せます。ソウルの動物病院とペットショップも収録。">
<meta name="theme-color" content="#2F6B54">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="犬同伴マップ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="mast">
  <h1><span class="sub" id="t-eyebrow">KOREA · DOG-FRIENDLY</span><span id="t-title">韓国犬同伴マップ</span></h1>
  <div class="assurance">
    <svg class="paw" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="6.5" cy="9" rx="2.6" ry="3.4"/><ellipse cx="12" cy="6.6" rx="2.7" ry="3.6"/><ellipse cx="17.5" cy="9" rx="2.6" ry="3.4"/><path d="M12 12.4c3.4 0 6 2.5 6 5 0 1.7-1.4 2.9-3.2 2.9-1.1 0-1.9-.5-2.8-.5s-1.7.5-2.8.5C7.4 20.3 6 19.1 6 17.4c0-2.5 2.6-5 6-5z"/></svg>
    <span id="t-assurance"></span>
  </div>
  <span class="spacer"></span>
  <div class="langsw" role="group" aria-label="Language">
    <button data-lang="ja">日本語</button><button data-lang="en">EN</button>
  </div>
  <button class="ghost" id="account"><span id="t-login">ログイン</span></button>
  <button class="ghost" id="install"></button>
</header>

<div class="mobtabs" role="tablist">
  <button id="tabList" aria-pressed="true"></button>
  <button id="tabMap" aria-pressed="false"></button>
</div>

<div class="app">
  <aside class="panel">
    <div class="controls">
      <div class="crow">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="q" type="search" aria-label="search">
        </label>
        <button class="ftoggle" id="ftoggle" aria-expanded="false" aria-controls="cbody">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
          <span id="t-filters"></span>
          <span class="fcount" id="fcount" hidden>0</span>
        </button>
      </div>
      <div class="cbody" id="cbody">
        <div class="seg" role="group" aria-label="kind">
          <button data-kind="" aria-pressed="true"></button>
          <button data-kind="cafe" aria-pressed="false"><span class="dot"></span></button>
          <button data-kind="meal" aria-pressed="false"><span class="dot"></span></button>
        </div>
        <div class="selrow">
          <select id="sido" aria-label="region"></select>
          <select id="sigungu" aria-label="city"></select>
        </div>
        <div class="selrow">
          <select id="genre" aria-label="cuisine"></select>
        </div>
        <div class="selrow">
          <select id="sort" aria-label="sort"></select>
        </div>
        <div class="checks">
          <label class="chk t"><input type="checkbox" id="ter"><span></span></label>
          <label class="chk f"><input type="checkbox" id="favonly"><span></span></label>
          <label class="chk m"><input type="checkbox" id="mineonly"><span></span></label>
          <label class="chk v"><input type="checkbox" id="vet"><span></span></label>
          <label class="chk p"><input type="checkbox" id="shop"><span></span></label>
          <label class="chk h"><input type="checkbox" id="stay"><span></span></label>
          <label class="chk l"><input type="checkbox" id="onlylang"><span></span></label>
        </div>
      </div>
    </div>
    <div class="tally"><span><b id="n">0</b> <span id="t-unit"></span></span><button class="reset" id="reset"></button></div>
    <ul class="list" id="list"></ul>
    <div class="mapcount"><b id="nmap">0</b> <span id="t-unit2"></span></div>
    <div class="zoomhint" id="zoomhint" hidden></div>
  </aside>

  <main class="mapwrap">
    <div id="map"></div>
    <div class="maphint" id="maphint" hidden></div>
    <div class="mapbtns">
      <button class="mapbtn" id="addpin"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="mapbtn" id="locate"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      <button class="mapbtn" id="fitall"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="legend">
      <h4 id="t-legend"></h4>
      <div class="lrow"><span class="k j"></span><span id="t-lcafe"></span></div>
      <div class="lrow"><span class="k o"></span><span id="t-lmeal"></span></div>
      <div class="lrow"><span class="k t"></span><span id="t-lter"></span></div>
      <div class="lrow"><span class="k u"></span><span id="t-lmine"></span></div>
      <div class="lrow"><span class="k v"></span><span id="t-lvet"></span></div>
      <div class="lrow"><span class="k p"></span><span id="t-lshop"></span></div>
      <div class="lrow"><span class="k h"></span><span id="t-lstay"></span></div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="detail" id="detail" aria-label="details"></aside>

<div class="scrim" id="modalScrim"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>

<script src="config.js"></script>
<script src="vendor/leaflet.js"></script>
<script src="vendor/supabase.js"></script>
<script src="i18n.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
