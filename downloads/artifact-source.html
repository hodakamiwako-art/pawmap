<title>ソウル犬同伴マップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">

<style>
:root{
  --ground:#EDF0EC;
  --surface:#FBFCFA;
  --surface-2:#E4E9E3;
  --line:#CBD4CB;
  --line-soft:#DDE3DC;
  --ink:#161F1A;
  --ink-2:#3D4B43;
  --muted:#68766C;
  --jade:#2F6B54;
  --jade-soft:#A9C9B8;
  --jade-wash:#DCE9E1;
  --ochre:#A9682A;
  --ochre-soft:#E0C09A;
  --ochre-wash:#F0E4D5;
  --river:#C3D6DA;
  --land:#F6F8F5;
  --shadow:0 1px 2px rgba(22,31,26,.06),0 8px 24px rgba(22,31,26,.07);
  --shadow-lg:0 2px 6px rgba(22,31,26,.10),0 24px 60px rgba(22,31,26,.18);
  --f-disp:"Zen Old Mincho","Hiragino Mincho ProN",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  --f-ko:"IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D120F;
    --surface:#151D18;
    --surface-2:#1E2822;
    --line:#2C3A32;
    --line-soft:#232F28;
    --ink:#E4EBE5;
    --ink-2:#B4C2B8;
    --muted:#8A9A8F;
    --jade:#71C4A0;
    --jade-soft:#2E5A48;
    --jade-wash:#172A22;
    --ochre:#D79A5C;
    --ochre-soft:#5C4527;
    --ochre-wash:#2A2018;
    --river:#1B3138;
    --land:#18211B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#0D120F; --surface:#151D18; --surface-2:#1E2822; --line:#2C3A32; --line-soft:#232F28;
  --ink:#E4EBE5; --ink-2:#B4C2B8; --muted:#8A9A8F; --jade:#71C4A0; --jade-soft:#2E5A48;
  --jade-wash:#172A22; --ochre:#D79A5C; --ochre-soft:#5C4527; --ochre-wash:#2A2018;
  --river:#1B3138; --land:#18211B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--f-body);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
:lang(ko),.ko{font-family:var(--f-ko)}
button{font:inherit;color:inherit}
a{color:var(--jade)}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:4px}

/* ---------- masthead ---------- */
.mast{
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px;
  padding:18px 22px 14px;border-bottom:1px solid var(--line);
  background:var(--surface);
}
.mast h1{
  font-family:var(--f-disp);font-weight:700;font-size:25px;line-height:1.15;
  margin:0;letter-spacing:.01em;text-wrap:balance;
}
.mast h1 .sub{display:block;font-family:var(--f-body);font-size:11px;font-weight:500;
  letter-spacing:.16em;color:var(--muted);margin-bottom:5px}
.assurance{
  display:flex;align-items:center;gap:9px;margin-left:auto;
  background:var(--jade-wash);border:1px solid var(--jade-soft);
  border-radius:999px;padding:6px 15px 6px 11px;font-size:12.5px;color:var(--ink-2);
}
.assurance b{color:var(--jade);font-weight:700}
.paw{width:17px;height:17px;flex:none;fill:var(--jade)}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:400px 1fr;height:calc(100vh - 78px);min-height:540px}

/* ---------- left panel ---------- */
.panel{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.controls{padding:14px 16px 12px;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:11px}
.search{position:relative;display:flex}
.search input{
  width:100%;font:inherit;font-size:14px;padding:9px 12px 9px 34px;
  background:var(--ground);border:1px solid var(--line);border-radius:9px;color:var(--ink);
}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}

.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:3px}
.seg button{
  flex:1;border:0;background:none;padding:6px 4px;border-radius:6px;cursor:pointer;
  font-size:13px;font-weight:500;color:var(--muted);transition:.15s;
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.seg button:nth-child(2) .dot{background:var(--jade)}
.seg button:nth-child(3) .dot{background:var(--ochre)}

.selrow{display:flex;gap:8px}
.selrow select{
  flex:1;min-width:0;font:inherit;font-size:13px;padding:7px 9px;border-radius:8px;
  border:1px solid var(--line);background:var(--ground);color:var(--ink);
}
.terrace-toggle{
  display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer;
  padding:2px 2px;user-select:none;
}
.terrace-toggle input{accent-color:var(--ochre);width:15px;height:15px}

.tally{
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  padding:9px 17px;border-bottom:1px solid var(--line-soft);
  font-size:12px;color:var(--muted);letter-spacing:.03em;background:var(--ground);
}
.tally b{font-size:16px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.reset{border:0;background:none;color:var(--jade);font-size:12px;cursor:pointer;padding:2px 4px;text-decoration:underline;text-underline-offset:2px}

.list{list-style:none;margin:0;padding:6px;overflow-y:auto;flex:1;min-height:0;scroll-behavior:smooth}
.card{
  display:grid;grid-template-columns:auto 1fr;gap:2px 11px;width:100%;text-align:left;
  border:1px solid transparent;border-radius:11px;background:none;padding:10px 11px;cursor:pointer;
  transition:background .13s,border-color .13s;
}
.card:hover{background:var(--surface-2)}
.card.on{background:var(--jade-wash);border-color:var(--jade-soft)}
.card .bullet{grid-row:span 3;width:11px;height:11px;border-radius:50%;margin-top:6px;background:var(--jade)}
.card.r .bullet{background:var(--ochre)}
.card .bullet.t{box-shadow:0 0 0 2.5px var(--surface),0 0 0 4px currentColor;color:var(--ochre)}
.card .nm{font-size:14.5px;font-weight:700;line-height:1.35}
.card .ko{font-family:var(--f-ko);font-size:12.5px;color:var(--ink-2);line-height:1.4}
.card .meta{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:3px;align-items:center}
.tag{
  display:inline-block;font-size:10.5px;letter-spacing:.04em;padding:1.5px 7px;border-radius:5px;
  background:var(--surface-2);color:var(--ink-2);white-space:nowrap;
}
.tag.g{background:var(--jade-wash);color:var(--jade);font-weight:500}
.tag.o{background:var(--ochre-wash);color:var(--ochre);font-weight:500}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- map ---------- */
.mapwrap{position:relative;background:var(--ground);overflow:hidden}
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map.drag{cursor:grabbing}
.gu{fill:var(--land);stroke:var(--line);stroke-width:.8;vector-effect:non-scaling-stroke}
.gu.hi{fill:var(--jade-wash)}
.river{fill:var(--river);stroke:none}
.gulabel{
  font-family:var(--f-body);font-size:10px;fill:var(--muted);text-anchor:middle;
  letter-spacing:.14em;pointer-events:none;transition:opacity .2s;
}
.pin{cursor:pointer}
.pin circle.hit{fill:transparent}
.pin circle.core{fill:var(--jade);stroke:var(--surface);stroke-width:1.6;vector-effect:non-scaling-stroke;transition:r .15s}
.pin.r circle.core{fill:var(--ochre)}
.pin circle.ring{fill:none;stroke:var(--ochre);stroke-width:1.4;vector-effect:non-scaling-stroke;opacity:.85}
.pin.dim{opacity:.11;pointer-events:none}
.pin.on circle.core{stroke:var(--ink);stroke-width:2.4}
.pin.on circle.halo{fill:var(--jade);opacity:.2}
.pin.r.on circle.halo{fill:var(--ochre)}

.legend{
  position:absolute;left:16px;bottom:16px;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:11px 14px;box-shadow:var(--shadow);font-size:12px;max-width:250px;
}
.legend .lrow{display:flex;align-items:center;gap:9px;margin-top:6px;color:var(--ink-2)}
.legend .lrow:first-of-type{margin-top:0}
.legend .k{width:12px;height:12px;border-radius:50%;flex:none}
.legend .k.j{background:var(--jade)} .legend .k.o{background:var(--ochre)}
.legend .k.t{background:none;border:1.5px solid var(--ochre);box-shadow:inset 0 0 0 2.5px var(--surface),inset 0 0 0 6px var(--ochre)}
.legend h4{margin:0 0 8px;font-size:10.5px;letter-spacing:.15em;color:var(--muted);font-weight:500}
.legend .note{margin-top:9px;padding-top:8px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--muted);line-height:1.5}

.zoom{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.zoom button{width:34px;height:32px;border:0;background:none;cursor:pointer;font-size:17px;line-height:1;color:var(--ink-2)}
.zoom button+button{border-top:1px solid var(--line-soft)}
.zoom button:hover{background:var(--surface-2)}
.zoom button.rs{font-size:11px;letter-spacing:.05em}

/* ---------- detail ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,12,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.detail{
  position:fixed;right:0;top:0;bottom:0;width:min(430px,100%);background:var(--surface);
  border-left:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:50;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;overflow-y:auto;
}
.detail.open{transform:none}
.detail .top{padding:20px 22px 16px;border-bottom:1px solid var(--line-soft);position:relative}
.close{position:absolute;right:14px;top:14px;width:30px;height:30px;border:1px solid var(--line);
  background:var(--surface);border-radius:8px;cursor:pointer;font-size:15px;line-height:1;color:var(--muted)}
.close:hover{background:var(--surface-2)}
.eyebrow{font-size:10.5px;letter-spacing:.17em;color:var(--muted);margin-bottom:7px}
.detail h2{font-family:var(--f-disp);font-size:23px;margin:0 0 4px;line-height:1.25;padding-right:34px;text-wrap:balance}
.detail .hangul{
  font-family:var(--f-ko);font-weight:600;font-size:27px;line-height:1.3;color:var(--jade);
  margin:10px 0 0;user-select:all;
}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;
  padding:5px 11px;border-radius:7px;border:1px solid transparent}
.badge.in{background:var(--jade-wash);border-color:var(--jade-soft);color:var(--jade)}
.badge.ter{background:var(--ochre-wash);border-color:var(--ochre-soft);color:var(--ochre)}
.badge.no{background:var(--surface-2);color:var(--muted)}

.dl{margin:0;padding:16px 22px;display:grid;grid-template-columns:74px 1fr;gap:11px 14px;font-size:13.5px;
  border-bottom:1px solid var(--line-soft)}
.dl dt{color:var(--muted);font-size:12px;padding-top:1px}
.dl dd{margin:0;color:var(--ink)}
.dl dd.addr{font-family:var(--f-ko);font-size:13px;user-select:all;line-height:1.5}
.stars{font-variant-numeric:tabular-nums}

.phrase{margin:16px 22px;background:var(--ground);border:1px dashed var(--line);border-radius:11px;padding:14px 16px}
.phrase .lab{font-size:10.5px;letter-spacing:.15em;color:var(--muted);margin-bottom:8px}
.phrase .ko{font-family:var(--f-ko);font-size:17px;font-weight:600;line-height:1.45;user-select:all}
.phrase .ja{font-size:12px;color:var(--muted);margin-top:5px}

.links{padding:4px 22px 26px;display:flex;flex-direction:column;gap:8px}
.links a{
  display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;
  border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:13.5px;
  color:var(--ink);background:var(--surface);transition:.14s;
}
.links a:hover{background:var(--surface-2);border-color:var(--jade-soft)}
.links a .arr{color:var(--muted);font-size:12px}
.links a.primary{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:500}
.links a.primary .arr{color:rgba(255,255,255,.7)}
.links a.primary:hover{filter:brightness(1.07)}

.foot{padding:16px 22px 24px;border-top:1px solid var(--line-soft);color:var(--muted);font-size:11.5px;line-height:1.65}

/* ---------- responsive ---------- */
.mobtabs{display:none}
@media(max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:calc(100vh - 110px)}
  .mobtabs{display:flex;gap:3px;padding:7px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
  .mobtabs button{flex:1;border:1px solid var(--line);background:var(--ground);border-radius:8px;padding:7px;
    font-size:13px;cursor:pointer;color:var(--muted)}
  .mobtabs button[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:500}
  .panel{border-right:0}
  body[data-view="map"] .panel{display:none}
  body[data-view="list"] .mapwrap{display:none}
  .assurance{margin-left:0;width:100%}
  .legend{left:10px;bottom:10px;padding:9px 11px;font-size:11px;max-width:190px}
  .legend .note{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header class="mast">
  <h1><span class="sub">SEOUL · DOG-FRIENDLY</span>ソウル犬同伴マップ</h1>
  <div class="assurance">
    <svg class="paw" viewBox="0 0 24 24"><ellipse cx="6.5" cy="9" rx="2.6" ry="3.4"/><ellipse cx="12" cy="6.6" rx="2.7" ry="3.6"/><ellipse cx="17.5" cy="9" rx="2.6" ry="3.4"/><path d="M12 12.4c3.4 0 6 2.5 6 5 0 1.7-1.4 2.9-3.2 2.9-1.1 0-1.9-.5-2.8-.5s-1.7.5-2.8.5C7.4 20.3 6 19.1 6 17.4c0-2.5 2.6-5 6-5z"/></svg>
    <span>全<b>100</b>軒すべて<b>店内に犬と入れます</b>（韓国政府の登録店）</span>
  </div>
</header>

<div class="mobtabs" role="tablist">
  <button id="tabList" aria-pressed="true">リスト</button>
  <button id="tabMap" aria-pressed="false">地図</button>
</div>

<div class="app">
  <aside class="panel">
    <div class="controls">
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="店名・ジャンル・エリアで検索（한글もOK）" aria-label="検索">
      </label>
      <div class="seg" role="group" aria-label="種別">
        <button data-kind="" aria-pressed="true">すべて</button>
        <button data-kind="カフェ" aria-pressed="false"><span class="dot"></span>カフェ</button>
        <button data-kind="レストラン" aria-pressed="false"><span class="dot"></span>ごはん</button>
      </div>
      <div class="selrow">
        <select id="genre" aria-label="ジャンル"><option value="">ジャンル：すべて</option></select>
        <select id="area" aria-label="区"><option value="">区：すべて</option></select>
      </div>
      <label class="terrace-toggle"><input type="checkbox" id="ter">テラス席のある店だけ表示</label>
    </div>
    <div class="tally"><span><b id="n">100</b> 軒</span><button class="reset" id="reset">絞り込みを解除</button></div>
    <ul class="list" id="list"></ul>
  </aside>

  <main class="mapwrap">
    <svg id="map" role="img" aria-label="ソウルの犬同伴可能な店の地図"></svg>
    <div class="zoom">
      <button id="zin" aria-label="拡大">＋</button>
      <button id="zout" aria-label="縮小">−</button>
      <button id="zrs" class="rs" aria-label="全体表示">全体</button>
    </div>
    <div class="legend">
      <h4>凡例</h4>
      <div class="lrow"><span class="k j"></span>カフェ・ベーカリー</div>
      <div class="lrow"><span class="k o"></span>レストラン・食事</div>
      <div class="lrow"><span class="k t"></span>テラス席あり</div>
      <div class="note">ピンをタップすると、店員に見せるためのハングル店名と住所が出ます。</div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>

/* ---------- projection ---------- */
const LAT0 = 37.55, K = Math.cos(LAT0*Math.PI/180);
const prj = (lon,lat)=>[lon*K*1000, -lat*1000];
let bx={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9};
for(const rings of Object.values(GEO.gu)) for(const r of rings) for(const [lo,la] of r){
  const [x,y]=prj(lo,la);
  bx.x0=Math.min(bx.x0,x); bx.x1=Math.max(bx.x1,x);
  bx.y0=Math.min(bx.y0,y); bx.y1=Math.max(bx.y1,y);
}
const PAD=1.5, W=bx.x1-bx.x0+PAD*2, H=bx.y1-bx.y0+PAD*2;
const HOME={x:bx.x0-PAD,y:bx.y0-PAD,w:W,h:H};

const svg=document.getElementById('map');
const NS='http://www.w3.org/2000/svg';
const el=(n,a={})=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
const path=rings=>rings.map(r=>'M'+r.map(([lo,la])=>{const[x,y]=prj(lo,la);return x.toFixed(2)+' '+y.toFixed(2);}).join('L')+'Z').join('');

const gGu=el('g'), gRiver=el('g'), gLab=el('g'), gPin=el('g');
const centroids={};
for(const [name,rings] of Object.entries(GEO.gu)){
  const p=el('path',{d:path(rings),class:'gu','data-gu':name}); gGu.appendChild(p);
  let sx=0,sy=0,n=0;
  for(const [lo,la] of rings[0]){const[x,y]=prj(lo,la);sx+=x;sy+=y;n++;}
  centroids[name]=[sx/n,sy/n];
}
gRiver.appendChild(el('path',{d:path(GEO.river),class:'river'}));
for(const [name,[x,y]] of Object.entries(centroids)){
  const t=el('text',{x:x.toFixed(1),y:y.toFixed(1),class:'gulabel'});
  t.textContent=GUJA[name]||name; gLab.appendChild(t);
}
svg.append(gGu,gRiver,gLab,gPin);

/* ---------- pins ---------- */
const pins=PLACES.map(p=>{
  const [x,y]=prj(p.lng,p.lat);
  const g=el('g',{class:'pin'+(p.kind==='レストラン'?' r':''),tabindex:'0',role:'button'});
  g.setAttribute('aria-label',p.name_ja+' / '+p.genre);
  g.appendChild(el('circle',{class:'halo',cx:x,cy:y,r:2.6,fill:'none'}));
  if(p.terrace==='あり') g.appendChild(el('circle',{class:'ring',cx:x,cy:y,r:2.0}));
  g.appendChild(el('circle',{class:'core',cx:x,cy:y,r:1.15}));
  g.appendChild(el('circle',{class:'hit',cx:x,cy:y,r:3.4}));
  g.addEventListener('click',()=>select(p.id));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(p.id);}});
  gPin.appendChild(g);
  return {p,g,x,y};
});

/* ---------- viewport ---------- */
let vb={...HOME};
function apply(){
  svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const z=HOME.w/vb.w;
  gLab.style.opacity = z>3.2?0:.95;
  // keep pins a constant size on screen, growing gently as you zoom in
  const px=vb.w/(svg.clientWidth||900);
  const core=(4.8+Math.min(2.6,Math.log2(Math.max(1,z))*0.55))*px;
  for(const {g} of pins){
    g.querySelector('.core').setAttribute('r',core.toFixed(3));
    g.querySelector('.halo').setAttribute('r',(core*2.6).toFixed(3));
    const rg=g.querySelector('.ring'); if(rg) rg.setAttribute('r',(core*1.85).toFixed(3));
    g.querySelector('.hit').setAttribute('r',(core*2.9).toFixed(3));
  }
}
function zoomAt(f,cx,cy){
  const nw=Math.max(HOME.w/70,Math.min(HOME.w,vb.w/f));
  const nh=nw*(HOME.h/HOME.w);
  vb={x:cx-(cx-vb.x)*(nw/vb.w),y:cy-(cy-vb.y)*(nh/vb.h),w:nw,h:nh};
  apply();
}
function fitTo(x,y,w){
  const nw=Math.max(HOME.w/70,w), nh=nw*(HOME.h/HOME.w);
  vb={x:x-nw/2,y:y-nh/2,w:nw,h:nh}; apply();
}
function toUser(ev){
  const r=svg.getBoundingClientRect();
  return [vb.x+(ev.clientX-r.left)/r.width*vb.w, vb.y+(ev.clientY-r.top)/r.height*vb.h];
}
svg.addEventListener('wheel',e=>{e.preventDefault();const[cx,cy]=toUser(e);zoomAt(e.deltaY<0?1.22:1/1.22,cx,cy);},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};svg.setPointerCapture(e.pointerId);svg.classList.add('drag');});
svg.addEventListener('pointermove',e=>{
  if(!drag)return; const r=svg.getBoundingClientRect();
  vb.x=drag.vx-(e.clientX-drag.x)/r.width*vb.w;
  vb.y=drag.vy-(e.clientY-drag.y)/r.height*vb.h; apply();
});
const endDrag=()=>{drag=null;svg.classList.remove('drag');};
svg.addEventListener('pointerup',endDrag); svg.addEventListener('pointercancel',endDrag);
document.getElementById('zin').onclick=()=>zoomAt(1.45,vb.x+vb.w/2,vb.y+vb.h/2);
document.getElementById('zout').onclick=()=>zoomAt(1/1.45,vb.x+vb.w/2,vb.y+vb.h/2);
document.getElementById('zrs').onclick=()=>{vb={...HOME};apply();};

/* ---------- filters ---------- */
const $=id=>document.getElementById(id);
const st={q:'',kind:'',genre:'',area:'',ter:false,sel:null};

const genres=[...new Set(PLACES.map(p=>p.genre))].sort((a,b)=>a.localeCompare(b,'ja'));
for(const g of genres) $('genre').append(new Option(g,g));
const areas=[...new Set(PLACES.map(p=>p.gu_ja))].sort((a,b)=>a.localeCompare(b,'ja'));
for(const a of areas) $('area').append(new Option(a,a));

function match(p){
  if(st.kind && p.kind!==st.kind) return false;
  if(st.genre && p.genre!==st.genre) return false;
  if(st.area && p.gu_ja!==st.area) return false;
  if(st.ter && p.terrace!=='あり') return false;
  if(st.q){
    const h=(p.name_ja+p.name_ko+p.genre+p.detail+p.area_ja+p.area_ko+p.gu_ja+p.cat_ko+p.addr_ko).toLowerCase();
    if(!h.includes(st.q.toLowerCase())) return false;
  }
  return true;
}
const listEl=$('list');
function render(){
  const vis=PLACES.filter(match);
  $('n').textContent=vis.length;
  listEl.innerHTML='';
  if(!vis.length){
    const li=document.createElement('li');
    li.className='empty'; li.textContent='条件に合う店がありません。絞り込みを緩めてみてください。';
    listEl.appendChild(li);
  }
  for(const p of vis){
    const li=document.createElement('li');
    const b=document.createElement('button');
    b.className='card'+(p.kind==='レストラン'?' r':'')+(st.sel===p.id?' on':'');
    b.id='card-'+p.id;
    b.innerHTML=
      `<span class="bullet${p.terrace==='あり'?' t':''}"></span>`+
      `<span class="nm"></span><span class="ko"></span>`+
      `<span class="meta"><span class="tag ${p.kind==='カフェ'?'g':'o'}"></span>`+
      `${p.terrace==='あり'?'<span class="tag o">テラス席あり</span>':''}`+
      `<span class="ar"></span></span>`;
    b.querySelector('.nm').textContent=p.name_ja;
    b.querySelector('.ko').textContent=p.name_ko;
    b.querySelector('.tag').textContent=p.genre;
    b.querySelector('.ar').textContent=p.area_ja;
    b.onclick=()=>select(p.id,true);
    li.appendChild(b); listEl.appendChild(li);
  }
  const ids=new Set(vis.map(p=>p.id));
  for(const {p,g} of pins) g.classList.toggle('dim',!ids.has(p.id));
}
$('q').oninput=e=>{st.q=e.target.value.trim();render();};
$('genre').onchange=e=>{st.genre=e.target.value;render();};
$('area').onchange=e=>{st.area=e.target.value;render();};
$('ter').onchange=e=>{st.ter=e.target.checked;render();};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  st.kind=b.dataset.kind;
  document.querySelectorAll('.seg button').forEach(o=>o.setAttribute('aria-pressed',String(o===b)));
  render();
});
$('reset').onclick=()=>{
  st.q='';st.kind='';st.genre='';st.area='';st.ter=false;
  $('q').value='';$('genre').value='';$('area').value='';$('ter').checked=false;
  document.querySelectorAll('.seg button').forEach((o,i)=>o.setAttribute('aria-pressed',String(i===0)));
  render();
};

  detail.querySelector('.j-detail').textContent=p.detail;
  detail.querySelector('.addr').textContent=p.addr_ko;
  detail.querySelector('.stars').textContent=p.rating?`★ ${p.rating} / 5　口コミ ${p.reviews}件`:'—';
  detail.querySelector('.j-ind').textContent=p.induty;
  detail.querySelector('.close').onclick=close;
  detail.classList.add('open'); scrim.classList.add('open');
  detail.scrollTop=0;
}
function close(){
  detail.classList.remove('open'); scrim.classList.remove('open');
  st.sel=null;
  for(const {g} of pins) g.classList.remove('on');
  document.querySelectorAll('.card.on').forEach(c=>c.classList.remove('on'));
}
scrim.onclick=close;
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});

/* ---------- mobile tabs ---------- */
document.body.dataset.view='list';
$('tabList').onclick=()=>{document.body.dataset.view='list';$('tabList').setAttribute('aria-pressed','true');$('tabMap').setAttribute('aria-pressed','false');};
$('tabMap').onclick=()=>{document.body.dataset.view='map';$('tabMap').setAttribute('aria-pressed','true');$('tabList').setAttribute('aria-pressed','false');apply();};

apply(); render();
</script>
